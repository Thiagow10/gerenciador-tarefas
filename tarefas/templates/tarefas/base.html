<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Gerenciador de Tarefas</title>
    <style>
        body { font-family: Arial, sans-serif; background: #f4f6f8; margin: 0; color: #222; }
        .container { max-width: 700px; margin: 30px auto; background: #fff; padding: 24px; border-radius: 8px; box-shadow: 0 2px 6px rgba(0,0,0,.1); }
        h1 { margin-top: 0; }
        a { color: #2563eb; text-decoration: none; }
        .btn { display: inline-block; background: #2563eb; color: #fff; border: 0; padding: 8px 14px; border-radius: 4px; cursor: pointer; font-size: 14px; }
        .btn-red { background: #dc2626; }
        .btn-green { background: #16a34a; }
        .resumo { display: flex; gap: 12px; margin: 16px 0; }
        .resumo div { flex: 1; background: #eef2ff; padding: 10px; border-radius: 6px; text-align: center; }
        .tarefa { border-bottom: 1px solid #e5e7eb; padding: 12px 0; display: flex; justify-content: space-between; align-items: center; gap: 10px; }
        .feita .nome { text-decoration: line-through; color: #888; }
        .tag { font-size: 12px; padding: 2px 8px; border-radius: 10px; background: #e5e7eb; }
        .acoes { display: flex; gap: 6px; align-items: center; }
        form.inline { display: inline; }
        input, textarea, select { width: 100%; padding: 8px; margin: 4px 0 12px; box-sizing: border-box; }
    </style>
</head>
<body>
    <div class="container">
        {% block conteudo %}{% endblock %}
    </div>
</body>
</html>
